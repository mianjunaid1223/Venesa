        function renderTable(data) {
            clearForUI();
            const container = document.createElement('div');
            container.className = 'dui-container';

            let rows = [];
            if (typeof data === 'string') {
                try { rows = JSON.parse(data); } catch { rows = []; }
            } else if (Array.isArray(data)) {
                rows = data;
            }

            if (!Array.isArray(rows)) rows = [rows];

            if (rows.length > 0) {
                const table = document.createElement('table');
                table.className = 'dui-table';

                const cols = Object.keys(rows[0]).filter(c => c !== 'CimClass' && c !== 'CimInstanceProperties' && c !== 'CimSystemProperties');
                const colLabels = { Id: 'PID', ProcessName: 'Name', CPU: 'CPU (s)', WorkingSet: 'Memory' };

                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                cols.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = colLabels[col] || col;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                rows.forEach(row => {
                    const tr = document.createElement('tr');
                    cols.forEach(col => {
                        const td = document.createElement('td');
                        let val = row[col];
                        if (col === 'WorkingSet' && typeof val === 'number') {
                            val = (val / 1024 / 1024).toFixed(1) + ' MB';
                        } else if (col === 'CPU' && typeof val === 'number') {
                            val = val.toFixed(1);
                        }
                        td.textContent = val ?? 'N/A';
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                container.appendChild(table);
            } else {
                const empty = document.createElement('div');
                empty.className = 'dui-empty';
                empty.textContent = 'No data available.';
                container.appendChild(empty);
            }

            resultsDiv.appendChild(container);
            divider.classList.add('visible');

            if (searchStartTime > 0) {
                const dur = ((performance.now() - searchStartTime) / 1000).toFixed(2);
                resultCountEl.textContent = `${rows.length} rows`;
                searchTimeEl.textContent = dur + 's';
                searchStats.classList.add('visible');
            }
            updateWindowHeight();
        }

        function renderCommandList(data) {
            loader.classList.remove("visible");
            loader.style.display = "none";
            resultsDiv.innerHTML = "";
            geminiResponse.style.display = "none";
            geminiResponse.classList.remove("visible");
            noResults.style.display = "none";
            resultsWrapper.classList.remove("collapsed");

            const container = document.createElement("div");
            container.className = "custom-commands-container";

            const cmds = data.customCommands || data.commands || [];

            if (cmds.length === 0) {
                const empty = document.createElement("div");
                empty.className = "commands-empty";
                empty.textContent = "No custom commands saved yet.";
                container.appendChild(empty);
            } else {
                cmds.forEach((cmd, i) => {
                    const card = document.createElement("div");
                    card.className = "command-card";
                    card.style.animationDelay = (i * 60) + "ms";

                    const trigger = document.createElement("div");
                    trigger.className = "command-trigger";
                    trigger.innerHTML = `
                        <span class="trigger-label">"${escapeHtml(cmd.trigger)}"</span>
                        <span class="trigger-badge">${cmd.actionCount || cmd.actions?.length || 0} action${(cmd.actionCount || cmd.actions?.length || 0) !== 1 ? 's' : ''}</span>
                    `;
                    card.appendChild(trigger);

                    if (cmd.actions && cmd.actions.length > 0) {
                        const actionsList = document.createElement("div");
                        actionsList.className = "command-actions-list";
                        cmd.actions.forEach(a => {
                            const pill = document.createElement("span");
                            pill.className = "command-action-pill";
                            const label = a.action + (a.appName ? `: ${a.appName}` : a.command ? `: ${a.command}` : a.query ? `: ${a.query}` : '');
                            pill.textContent = label;
                            actionsList.appendChild(pill);
                        });
                        card.appendChild(actionsList);
                    }

                    container.appendChild(card);
                });
            }

            resultsDiv.appendChild(container);
            divider.classList.add("visible");
            resultItems = [];
            selectedIndex = -1;

            if (searchStartTime > 0) {
                const searchDuration = ((performance.now() - searchStartTime) / 1000).toFixed(2);
                resultCountEl.textContent = `${cmds.length} command${cmds.length !== 1 ? 's' : ''}`;
                searchTimeEl.textContent = searchDuration + "s";
                searchStats.classList.add("visible");
            }

            updateWindowHeight();
        }

        window.api.receive("dynamic-ui", (payload) => {
            loader.classList.remove("visible");
            loader.style.display = "none";
            renderDynamicUI(payload.component, payload.data);
        });

        function parseMarkdownTable(text) {
            const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.includes('|'));
            if (lines.length < 2) return null;
            const headers = lines[0].split('|').slice(1, -1).map(h => h.trim()).filter(Boolean);
            if (headers.length === 0) return null;
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                // skip separator rows (e.g. |---|---|)
                if (/^[\s|:=-]+$/.test(lines[i])) continue;
                const cols = lines[i].split('|').slice(1, -1).map(c => c.trim());
                if (cols.length === 0) continue;
                const row = {};
                headers.forEach((h, idx) => { row[h] = cols[idx] ?? ''; });
                rows.push(row);
            }
            return rows.length > 0 ? rows : null;
        }

        window.api.receive('ui-blocks', (blocks) => {
            if (!blocks || blocks.length === 0) return;
            loader.classList.remove('visible');
            loader.style.display = 'none';
            for (const block of blocks) {
                const rows = parseMarkdownTable(block);
                if (rows) {
                    renderTable(rows);
                } else {
                    showAIResponse(block);
                }
            }
        });

        settingsBtn.addEventListener("click", () => {
            window.api.send("open-settings");
        });

        // Voice button handler
        const voiceBtn = document.getElementById("voiceBtn");
        voiceBtn.addEventListener("click", () => {
            window.api.send("open-voice-window");
        });

        window.api.receive("set-input", (data) => {
            // data can be a string (query) or object {query, triggerSearch}
            const text = typeof data === 'string' ? data : data.query;
            const shouldTrigger = typeof data === 'string' ? true : data.trigger; // Default to triggering search

            if (text) {
                searchInput.value = text;
                searchInput.focus();

                // Check for Google mode first (// prefix) to avoid matching single slash
                if (text.startsWith("//")) {
                    setGoogleMode(true);
                    setAIMode(false);
                    searchInput.style.color = "var(--primary)";
                } else if (text.startsWith("/")) {
                    setAIMode(true);
                    setGoogleMode(false);
                    searchInput.style.color = "var(--primary)";
                } else {
                    setAIMode(false);
                    setGoogleMode(false);
                    searchInput.style.color = "var(--text-primary)";
                }

                if (shouldTrigger) {
                    // Manually trigger the 'input' event to run the debounced search logic
                    const event = new Event('input', { bubbles: true });
                    searchInput.dispatchEvent(event);
                }
            }
        });

        updateWindowHeight();
    </script>
</body>

</html>
