﻿﻿<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venesa</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-wrap: balance;
        animation: fadein 0.5s ease-in;
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          Roboto, sans-serif;
        background: #00000024;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
        color: white;
        box-shadow:
          rgba(0, 85, 255, 0.3) 0px 30px 60px -12px inset,
          rgba(255, 0, 251, 0.25) 0px 18px 36px -18px inset;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow:
            rgba(0, 85, 255, 0.614) 0px 15px 60px -12px inset,
            rgba(255, 0, 251, 0.25) 0px 15px 36px -18px inset;
        }

        50% {
          box-shadow:
            rgba(0, 85, 255, 0.6) 0px 30px 60px -12px inset,
            rgba(255, 0, 251, 0.5) 0px 18px 36px -18px inset;
        }

        90% {
          box-shadow:
            rgba(255, 0, 251, 0.25) 0px 15px 60px -12px inset,
            rgba(0, 85, 255, 0.3) 0px 15px 36px -18px inset;
        }

        100% {
          box-shadow:
            rgba(0, 85, 255, 0.614) 0px 15px 60px -12px inset,
            rgba(255, 0, 251, 0.25) 0px 15px 36px -18px inset;
        }
      }

      #voice-screen {
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(12px);
        position: relative;
      }

      #blob-container {
        position: fixed;
        bottom: 40px;
        right: 40px;
        z-index: 10;
      }

      .ai {
        --s: 180px;
        --p: calc(var(--s) / 4);
        width: var(--s);
        aspect-ratio: 1;
        padding: var(--p);
        display: grid;
        place-items: center;
        position: relative;
        animation: circle1 5s ease-in-out infinite;
        filter: drop-shadow(0 8px 25px rgba(234, 170, 255, 0.4));

        &::before,
        &::after {
          content: "";
          position: absolute;
          top: 50%;
          left: 50%;
          width: 50%;
          height: 50%;
          border-radius: 50%;
          border: 2px solid white;
          box-shadow: 0 0 20px rgba(234, 170, 255, 1);
          filter: blur(4px);
          transform: translate(-50%, -50%);
          animation: wave 1.5s linear infinite;
        }

        &::after {
          animation-delay: 0.4s;
        }
      }

      .ai.listening::before,
      .ai.listening::after {
        border-color: #4caf50;
        box-shadow: 0 0 25px rgba(76, 175, 80, 1);
      }

      .ai.speaking::before,
      .ai.speaking::after {
        border-color: #eaaaff;
        box-shadow: 0 0 30px rgba(234, 170, 255, 1);
        animation: waveSpeaking 0.8s linear infinite;
      }

      .ai.processing::before,
      .ai.processing::after {
        border-color: #ffa500;
        box-shadow: 0 0 25px rgba(255, 165, 0, 0.9);
        animation: waveProcessing 1.2s ease-in-out infinite;
      }

      @keyframes waveProcessing {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.4;
        }

        50% {
          transform: translate(-50%, -50%) scale(1.5);
          opacity: 1;
        }

        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.4;
        }
      }

      @keyframes wave {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }

        35% {
          transform: translate(-50%, -50%) scale(1.3);
          opacity: 1;
        }

        70%,
        100% {
          transform: translate(-50%, -50%) scale(1.6);
          opacity: 0;
        }
      }

      @keyframes waveSpeaking {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.3;
        }

        50% {
          transform: translate(-50%, -50%) scale(1.4);
          opacity: 1;
        }

        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.3;
        }
      }

      @keyframes ai1 {
        0% {
          transform: rotate(0deg) translate(50%) scale(0.9);
          opacity: 0;
        }

        25% {
          transform: rotate(90deg) translate(50%) scale(1.6);
          opacity: 1;
        }

        50% {
          transform: rotate(180deg) translate(50%) scale(0.7);
          opacity: 0.4;
        }

        75% {
          transform: rotate(270deg) translate(50%) scale(1.2);
          opacity: 1;
        }

        100% {
          transform: rotate(360deg) translate(50%) scale(0.9);
          opacity: 0;
        }
      }

      @keyframes ai2 {
        0% {
          transform: rotate(90deg) translate(50%) scale(0.5);
        }

        25% {
          transform: rotate(180deg) translate(50%) scale(1.5);
          opacity: 0;
        }

        50% {
          transform: rotate(270deg) translate(50%) scale(1);
          opacity: 0;
        }

        75% {
          transform: rotate(360deg) translate(50%) scale(0.8);
          opacity: 0;
        }

        100% {
          transform: rotate(450deg) translate(50%) scale(0.5);
          opacity: 1;
        }
      }

      @keyframes ai3 {
        0% {
          transform: rotate(180deg) translate(50%) scale(0.8);
          opacity: 0.8;
        }

        25% {
          transform: rotate(270deg) translate(50%) scale(1.4);
        }

        50% {
          transform: rotate(360deg) translate(50%) scale(0.6);
          opacity: 0.4;
        }

        75% {
          transform: rotate(450deg) translate(50%) scale(1.2);
          opacity: 0.7;
        }

        100% {
          transform: rotate(540deg) translate(50%) scale(0.8);
          opacity: 0.8;
        }
      }

      @keyframes ai4 {
        0% {
          transform: rotate(270deg) translate(50%) scale(1);
          opacity: 1;
        }

        25% {
          transform: rotate(360deg) translate(50%) scale(0.7);
        }

        50% {
          transform: rotate(450deg) translate(50%) scale(1.5);
          opacity: 0.5;
        }

        75% {
          transform: rotate(540deg) translate(50%) scale(0.9);
          opacity: 0.8;
        }

        100% {
          transform: rotate(630deg) translate(50%) scale(1);
          opacity: 1;
        }
      }

      .c {
        position: absolute;
        width: 180px;
        aspect-ratio: 1;
        border-radius: 50%;
      }

      .c1 {
        background: radial-gradient(50% 50% at center, #0066ff, #74bcd6);
        width: 120px;
        animation: ai1 5.5s linear infinite;
      }

      .c2 {
        background: radial-gradient(50% 50% at center, #ef788c, #e7e7fb);
        width: 70px;
        animation: ai2 6s linear infinite;
      }

      .c3 {
        background: radial-gradient(50% 50% at center, #eb7fc6, transparent);
        width: 100px;
        opacity: 0.6;
        animation: ai3 4.8s linear infinite;
      }

      .c4 {
        background: #6d67c8;
        animation: ai4 5.2s linear infinite;
      }

      .container {
        overflow: hidden;
        background: #b6a9f8;
        width: 100%;
        border-radius: 50%;
        aspect-ratio: 1;
        position: relative;
        display: grid;
        place-items: center;
      }

      .glass {
        overflow: hidden;
        position: absolute;
        inset: calc(var(--p) - 4px);
        border-radius: 50%;
        backdrop-filter: blur(8px);
        box-shadow:
          0 0 30px rgba(255, 255, 255, 0.3),
          0 30px 40px rgba(0, 0, 0, 0.2),
          0 0 20px rgba(255, 255, 255, 1);
        background: radial-gradient(
          50px at 70% 30%,
          rgba(255, 255, 255, 0.7),
          transparent
        );
      }

      .rings {
        aspect-ratio: 1;
        border-radius: 50%;
        position: absolute;
        inset: 0;
        perspective: 11rem;
        opacity: 0.9;

        &:before,
        &:after {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 4px solid transparent;
          mask:
            linear-gradient(#fff 0 0) padding-box,
            linear-gradient(#fff 0 0);
          background: linear-gradient(
              white,
              blue,
              magenta,
              rgb(255, 7, 7),
              lightyellow
            )
            border-box;
          mask-composite: exclude;
        }
      }

      .rings::before {
        animation: ring180 10s ease-in-out infinite;
      }

      .rings::after {
        animation: ring90 10s ease-in-out infinite;
      }

      @keyframes ring180 {
        0% {
          transform: rotateY(180deg) rotateX(180deg) rotateZ(180deg);
        }

        25% {
          transform: rotateY(180deg) rotateX(180deg) rotateZ(180deg);
        }

        50% {
          transform: rotateY(360deg) rotateX(360deg) rotateZ(360deg);
        }

        80% {
          transform: rotateY(360deg) rotateX(360deg) rotateZ(360deg);
        }

        100% {
          transform: rotateY(540deg) rotateX(540deg) rotateZ(540deg);
        }
      }

      @keyframes ring90 {
        0% {
          transform: rotateY(90deg) rotateX(90deg) rotateZ(90deg);
        }

        25% {
          transform: rotateY(90deg) rotateX(90deg) rotateZ(90deg) scale(1.1);
        }

        50% {
          transform: rotateY(270deg) rotateX(270deg) rotateZ(270deg);
        }

        75% {
          transform: rotateY(270deg) rotateX(270deg) rotateZ(270deg);
        }

        100% {
          transform: rotateY(450deg) rotateX(450deg) rotateZ(450deg);
        }
      }

      @keyframes circle1 {
        0%,
        100% {
          transform: scale(0.97);
        }

        15%,
        85% {
          transform: scale(1);
        }

        30% {
          transform: scale(0.98);
        }

        45% {
          transform: scale(1);
        }

        60% {
          transform: scale(0.97);
        }
      }

      #subtitles-container {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        pointer-events: none;
        width: min(720px, 90vw);
      }

      #subtitle-bubble {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        padding: 18px 32px;
        border-radius: 20px;
        box-shadow:
          0 8px 48px rgba(0, 0, 0, 0.2),
          0 2px 8px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        display: none;
        will-change: transform, opacity;
      }

      #subtitle-bubble.visible {
        display: block;
        animation: bubbleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      #subtitle-bubble.hiding {
        animation: bubbleOut 0.28s ease-out forwards;
      }

      @keyframes bubbleIn {
        0% {
          opacity: 0;
          transform: scale(0.8) translateY(20px);
        }

        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes bubbleOut {
        0% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }

        100% {
          opacity: 0;
          transform: scale(0.9) translateY(-10px);
        }
      }

      #subtitle-text {
        font-size: 22px;
        font-weight: 600;
        color: #1a1a2e;
        letter-spacing: -0.4px;
        line-height: 1.4;
        text-align: center;
        word-wrap: break-word;
      }

      .word-span {
        display: inline;
        transition:
          color 0.15s ease,
          text-shadow 0.15s ease;
      }

      .word-span.past {
        color: #999;
      }

      .word-span.current {
        color: #4da6ff;
        text-shadow: 0 0 20px rgba(77, 166, 255, 0.4);
      }

      .word-span.future {
        color: #1a1a1a;
      }

      /* ── Status row: holds primary badge + screen-viewed bubble ── */
      #status-row {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(10, 10, 20, 0.55);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 7px 16px 7px 12px;
        border-radius: 30px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        pointer-events: none;
        white-space: nowrap;
        transition:
          opacity 0.35s ease,
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        opacity: 0;
        transform: translateY(-8px);
      }

      #status.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── Screen-viewed bubble badge ── */
      #screen-badge {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(10, 10, 20, 0.55);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 7px 14px 7px 10px;
        border-radius: 30px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        border: 1px solid rgba(96, 200, 255, 0.3);
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        pointer-events: none;
        white-space: nowrap;
      }

      #screen-badge.visible {
        display: flex;
        animation: screenBadgePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)
          forwards;
      }

      #screen-badge.hiding {
        display: flex;
        animation: screenBadgeFade 0.3s ease forwards;
      }

      @keyframes screenBadgePop {
        from {
          opacity: 0;
          transform: scale(0.65) translateY(4px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes screenBadgeFade {
        from {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        to {
          opacity: 0;
          transform: scale(0.65) translateY(4px);
        }
      }

      .screen-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #60c8ff;
        box-shadow: 0 0 8px rgba(96, 200, 255, 0.9);
        flex-shrink: 0;
        animation: dotPulse 1.6s ease-in-out infinite;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        flex-shrink: 0;
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }

      .status-dot.listening {
        background: #4ade80;
        box-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
        animation: dotPulse 1.4s ease-in-out infinite;
      }

      .status-dot.thinking {
        background: #fb923c;
        box-shadow: 0 0 8px rgba(251, 146, 60, 0.8);
        animation: dotPulse 0.9s ease-in-out infinite;
      }

      .status-dot.speaking {
        background: #c084fc;
        box-shadow: 0 0 10px rgba(192, 132, 252, 0.9);
        animation: dotPulse 0.7s ease-in-out infinite;
      }

      .status-dot.selecting {
        background: #60a5fa;
        box-shadow: 0 0 8px rgba(96, 165, 250, 0.8);
        animation: dotPulse 1.2s ease-in-out infinite;
      }

      .status-dot.error {
        background: #f87171;
        box-shadow: 0 0 10px rgba(248, 113, 113, 0.95);
        animation: dotPulse 0.55s ease-in-out infinite;
      }

      @keyframes dotPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.5);
          opacity: 0.7;
        }
      }

      #partial {
        position: fixed;
        bottom: 200px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        color: rgba(255, 255, 255, 0.6);
        font-style: italic;
        text-align: center;
        font-weight: 400;
        max-width: 75%;
        pointer-events: none;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
        transition: opacity 0.2s ease;
      }

      /* ─── Voice results container ─── */

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-10px);
        }

        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      #voice-results .result-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        margin: 4px 0;
        border-radius: 10px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.15s ease;
      }

      #voice-results .result-item:hover,
      #voice-results .result-item.selected {
        background: rgba(234, 170, 255, 0.15);
        border-color: rgba(234, 170, 255, 0.3);
      }

      #voice-results .result-icon {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }

      #voice-results .result-icon svg {
        width: 18px;
        height: 18px;
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 1.5;
        fill: none;
      }

      #voice-results .result-icon.app-icon svg {
        stroke: #88c0ff;
      }

      #voice-results .result-icon.folder-icon svg {
        stroke: #f5c542;
      }

      #voice-results .result-content {
        flex: 1;
        min-width: 0;
      }

      #voice-results .result-name {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #voice-results .result-path {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #voice-results .result-index {
        font-size: 12px;
        color: rgba(234, 170, 255, 0.8);
        font-weight: 600;
        min-width: 20px;
      }

      #voice-results-header {
        padding: 8px 14px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
      }

      /* ─── Voice results ─── */
      #voice-results {
        position: fixed;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 580px;
        max-height: 58vh;
        background: rgba(12, 12, 24, 0.88);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border-radius: 18px;
        padding: 10px;
        overflow-y: auto;
        display: none;
        z-index: 50;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 12px 48px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      #voice-results.visible {
        display: block;
        animation: fadeSlideIn 0.3s ease-out forwards;
      }

      /* Dynamic UI component styling */
      .dui-container {
        margin-top: 10px;
      }
      .dui-kv-grid {
        display: grid;
        gap: 8px;
      }

      .dui-kv-item {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 4px;
      }

      .dui-kv-key {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
      }

      .dui-kv-value {
        color: white;
        font-weight: 500;
        font-size: 12px;
        text-align: right;
      }

      .dui-card-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .dui-card {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dui-card-icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }

      .dui-card-icon svg {
        width: 100%;
        height: 100%;
        stroke: rgba(255, 255, 255, 0.7);
        fill: none;
        stroke-width: 2;
      }

      .dui-card-title {
        font-size: 13px;
        font-weight: 500;
        color: white;
      }

      .dui-card-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
      }

      .dui-card-badge {
        font-size: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 12px;
      }

      .dui-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .dui-table th {
        text-align: left;
        padding: 6px;
        color: rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .dui-table td {
        padding: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .dui-empty {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-style: italic;
        padding: 20px 0;
      }

      .custom-commands-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .command-card {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px;
        border-radius: 8px;
      }

      .command-trigger {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .trigger-label {
        font-weight: bold;
        font-size: 13px;
        color: white;
      }

      .trigger-badge {
        font-size: 11px;
        background: rgba(234, 170, 255, 0.2);
        color: #eaaaff;
        padding: 2px 6px;
        border-radius: 10px;
      }

      .command-actions-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .command-action-pill {
        font-size: 11px;
        background: rgba(255, 255, 255, 0.1);
        padding: 3px 8px;
        border-radius: 12px;
      }

      .commands-empty {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div id="voice-screen">
      <div id="status-row">
        <div id="status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text"></span>
        </div>
        <div id="screen-badge">
          <span class="screen-badge-dot"></span>
          <span>Screen Viewed</span>
        </div>
      </div>
      <div id="partial"></div>

      <div id="voice-results">
        <div id="voice-results-header">
          Say a number to select, or say "cancel"
        </div>
        <div id="voice-results-list"></div>
      </div>

      <div id="subtitles-container">
        <div id="subtitle-bubble">
          <div id="subtitle-text"></div>
        </div>
      </div>

      <div id="blob-container">
        <div class="ai">
          <div class="container">
            <div class="c c4"></div>
            <div class="c c1"></div>
            <div class="c c2"></div>
            <div class="c c3"></div>
            <div class="rings"></div>
          </div>
          <div class="glass"></div>
        </div>
      </div>
    </div>

    <script>
      const VoiceState = {
        IDLE: "idle",
        LISTENING: "listening",
        PROCESSING: "thinking",
        SHOWING_RESULTS: "showing_results",
        AWAITING_SELECTION: "awaiting_selection",
        SPEAKING: "speaking",
        ERROR: "error",
      };

      let currentState = VoiceState.IDLE;
      let isListening = false;
      let isSpeaking = false;
      let audioContext = null;
      let mediaStream = null;
      let workletNode = null;
      let scriptProcessor = null;
      let currentAudio = null;
      let screenCaptured = false;
      let capturedImage = null;
      let currentWordIndex = 0;
      let words = [];
      let karaokeInterval = null;
      let wordSpans = [];
      let awaitingAudio = false;

      let hasActiveUI = false; // true while a dynamic-ui (table/key-value/etc.) is on screen

      const MAX_CONSECUTIVE_LISTENS = 3;
      let consecutiveListenCount = 0;
      let currentVoiceResults = [];
      let originalQuery = "";

      const statusEl = document.getElementById("status");
      const statusTextEl = document.getElementById("status-text");
      const statusDotEl = document.getElementById("status-dot");
      const screenBadgeEl = document.getElementById("screen-badge");
      const partialEl = document.getElementById("partial");
      let screenBadgeTimer = null;
      const subtitleBubble = document.getElementById("subtitle-bubble");
      const subtitleText = document.getElementById("subtitle-text");
      const blobEl = document.querySelector(".ai");
      const voiceResultsEl = document.getElementById("voice-results");
      const voiceResultsListEl = document.getElementById("voice-results-list");

      let activationAudioBuffer = null;
      let cuePreloaded = false;

      const AudioCue = {
        ACTIVATION: "activation",
        LISTENING: "listening",
        CLOSING: "closing",
      };

      // Pre-generated audio files - loaded as HTML5 Audio elements (no AudioContext conflicts)
      const cueAudio = {
        activation: null,
        listening: null,
        closing: null,
      };

      let isClosing = false; // Prevent double close sounds

      // Preload all cue files at startup
      function preloadActivationSound() {
        if (cuePreloaded) return;
        cuePreloaded = true;

        // Use HTML5 Audio - fast, simple, no crashes
        cueAudio.activation = new Audio("venesa-asset://cue-activation.wav");
        cueAudio.listening = new Audio("venesa-asset://cue-listening.wav");
        cueAudio.closing = new Audio("venesa-asset://cue-done.wav"); // Use done sound for closing (deeper, nicer tone)

        // Preload all
        Object.values(cueAudio).forEach((a) => {
          if (a) a.load();
        });
        console.log("[VoiceWindow] Audio cues preloaded");
      }

      // Fast audio playback - just clone and play
      function playAudioCue(cueType = AudioCue.ACTIVATION) {
        const audio = cueAudio[cueType];
        if (!audio) return;

        try {
          // Clone to allow overlapping plays
          const clone = audio.cloneNode();
          clone.volume = 0.7;
          clone.play().catch(() => {});
        } catch (e) {
          // Silent fail
        }
      }

      function setStatusLabel(text, dotClass) {
        if (!statusTextEl || !statusDotEl || !statusEl) return;
        statusTextEl.textContent = text;
        statusDotEl.className = "status-dot" + (dotClass ? " " + dotClass : "");
        if (text) {
          statusEl.classList.add("visible");
        } else {
          statusEl.classList.remove("visible");
        }
      }

      function showScreenBadge() {
        if (!screenBadgeEl) return;
        if (screenBadgeTimer) clearTimeout(screenBadgeTimer);
        screenBadgeEl.classList.remove("hiding");
        screenBadgeEl.classList.add("visible");
        screenBadgeTimer = setTimeout(() => hideScreenBadge(), 4000);
      }

      function hideScreenBadge() {
        if (!screenBadgeEl) return;
        if (screenBadgeTimer) {
          clearTimeout(screenBadgeTimer);
          screenBadgeTimer = null;
        }
        if (!screenBadgeEl.classList.contains("visible")) return;
        screenBadgeEl.classList.remove("visible");
        screenBadgeEl.classList.add("hiding");
        screenBadgeEl.addEventListener(
          "animationend",
          () => {
            screenBadgeEl.classList.remove("hiding");
          },
          { once: true },
        );
      }

      function setState(newState) {
        console.log(`[VoiceWindow] State: ${currentState} -> ${newState}`);
        currentState = newState;

        switch (newState) {
          case VoiceState.IDLE:
            blobEl.className = "ai";
            setStatusLabel("", "");
            break;
          case VoiceState.LISTENING:
            blobEl.className = "ai listening";
            setStatusLabel("Listening", "listening");
            break;
          case VoiceState.PROCESSING:
            blobEl.className = "ai processing";
            setStatusLabel("Thinking", "thinking");
            break;
          case VoiceState.SHOWING_RESULTS:
            blobEl.className = "ai";
            setStatusLabel("Select an item", "selecting");
            break;
          case VoiceState.AWAITING_SELECTION:
            blobEl.className = "ai listening";
            setStatusLabel("Listening for selection", "selecting");
            break;
          case VoiceState.SPEAKING:
            blobEl.className = "ai speaking";
            setStatusLabel("Speaking", "speaking");
            break;
          case VoiceState.ERROR:
            blobEl.className = "ai";
            setStatusLabel("Try again later", "error");
            break;
        }
      }

      function resetListenCounter() {
        consecutiveListenCount = 0;
      }
      function canAutoListen() {
        return consecutiveListenCount < MAX_CONSECUTIVE_LISTENS;
      }

      function float32ToInt16(float32Array) {
        const int16Array = new Int16Array(float32Array.length);
        for (let i = 0; i < float32Array.length; i++) {
          const s = Math.max(-1, Math.min(1, float32Array[i]));
          int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return int16Array;
      }

      function downsample(buffer, fromRate, toRate) {
        if (fromRate === toRate) return buffer;
        const ratio = fromRate / toRate;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);
        for (let i = 0; i < newLength; i++) {
          result[i] = buffer[Math.round(i * ratio)];
        }
        return result;
      }

      function getAppIcon() {
        return '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>';
      }

      function getFolderIcon() {
        return '<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
      }

      function getFileIcon() {
        return '<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>';
      }

      function displayVoiceResults(results) {
        currentVoiceResults = [];
        voiceResultsListEl.innerHTML = "";

        const apps = results.apps || [];
        const files = results.files || [];
        const folders = results.folders || [];
        let index = 1;

        apps.slice(0, 3).forEach((app) => {
          currentVoiceResults.push({ type: "app", data: app });
          voiceResultsListEl.appendChild(
            createResultItem(
              index++,
              app.name,
              "Application",
              "app-icon",
              getAppIcon(),
            ),
          );
        });

        folders.slice(0, 3).forEach((folderPath) => {
          const folderName = folderPath.split(/[\\/]/).pop();
          currentVoiceResults.push({ type: "folder", data: folderPath });
          voiceResultsListEl.appendChild(
            createResultItem(
              index++,
              folderName,
              "Folder",
              "folder-icon",
              getFolderIcon(),
            ),
          );
        });

        files.slice(0, 4).forEach((filePath) => {
          const fileName = filePath.split(/[\\/]/).pop();
          currentVoiceResults.push({ type: "file", data: filePath });
          voiceResultsListEl.appendChild(
            createResultItem(index++, fileName, "File", "", getFileIcon()),
          );
        });

        if (currentVoiceResults.length > 0) {
          voiceResultsEl.classList.add("visible");
          setState(VoiceState.SHOWING_RESULTS);
        }
      }

      function createResultItem(index, name, type, iconClass, iconSvg) {
        const item = document.createElement("div");
        item.className = "result-item";
        item.dataset.index = index;
        item.innerHTML = `
                <span class="result-index">${index}</span>
                <div class="result-icon ${iconClass}">${iconSvg}</div>
                <div class="result-content">
                    <div class="result-name">${escapeHtml(name)}</div>
                    <div class="result-path">${type}</div>
                </div>
            `;
        item.addEventListener("click", () => selectResult(index));
        return item;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function selectResult(index) {
        if (index < 1 || index > currentVoiceResults.length) return;
        const selected = currentVoiceResults[index - 1];
        hideVoiceResults();
        const data = selected.data;

        let itemName = "";
        let itemPath = "";

        if (selected.type === "app") {
          itemName = typeof data === "object" ? data.name : String(data);
          itemPath = typeof data === "object" ? data.path || "" : "";
        } else if (selected.type === "folder" || selected.type === "file") {
          itemPath =
            typeof data === "string" ? data : data.path || data.name || "";
          itemName = itemPath.split(/[\\/]/).pop();
        } else if (selected.type === "ui-item") {
          itemName = data.name || "";
          itemPath = data.type || "";
        }

        setState(VoiceState.PROCESSING);
        window.voiceApi.send("voice-file-action", {
          originalQuery: originalQuery,
          selectedItem: {
            type: selected.type,
            name: itemName,
            path: itemPath,
            data: data,
          },
        });
      }

      function hideVoiceResults() {
        voiceResultsEl.classList.remove("visible");
        currentVoiceResults = [];
        hasActiveUI = false;
      }

      function fullReset() {
        console.log(
          "[VoiceWindow] Full reset - stopping all audio and clearing state",
        );

        stopListening();

        if (currentAudio) {
          currentAudio.pause();
          currentAudio.src = "";
          currentAudio = null;
        }

        if (karaokeInterval) {
          clearInterval(karaokeInterval);
          karaokeInterval = null;
        }
        hideSubtitles();

        isSpeaking = false;
        awaitingAudio = false;
        shouldListenAgain = false;
        consecutiveListenCount = 0;
        hasActiveUI = false;
        words = [];
        wordSpans = [];
        originalQuery = "";

        hideVoiceResults();
        hideScreenBadge();

        screenCaptured = false;
        capturedImage = null;

        setState(VoiceState.IDLE);
        partialEl.textContent = "";
      }

      function startKaraoke(text, duration) {
        words = text.split(" ").filter((w) => w.trim());
        currentWordIndex = 0;
        wordSpans = [];

        if (words.length === 0) return;

        subtitleText.innerHTML = words
          .map(
            (word, i) =>
              `<span class="word-span future" data-index="${i}">${escapeHtml(word)}</span>`,
          )
          .join(" ");

        wordSpans = Array.from(subtitleText.querySelectorAll(".word-span"));

        subtitleBubble.classList.remove("hiding");
        subtitleBubble.classList.add("visible");

        if (wordSpans[0]) {
          wordSpans[0].classList.remove("future");
          wordSpans[0].classList.add("current");
        }

        if (words.length <= 1) {
          setTimeout(() => hideSubtitles(), duration + 500);
          return;
        }

        const wordDuration = duration / words.length;

        karaokeInterval = setInterval(() => {
          if (currentWordIndex < words.length - 1) {
            if (wordSpans[currentWordIndex]) {
              wordSpans[currentWordIndex].classList.remove("current");
              wordSpans[currentWordIndex].classList.add("past");
            }

            currentWordIndex++;

            if (wordSpans[currentWordIndex]) {
              wordSpans[currentWordIndex].classList.remove("future");
              wordSpans[currentWordIndex].classList.add("current");
            }
          } else {
            clearInterval(karaokeInterval);
            karaokeInterval = null;
            setTimeout(() => hideSubtitles(), 600);
          }
        }, wordDuration);
      }

      function hideSubtitles() {
        subtitleBubble.classList.add("hiding");
        setTimeout(() => {
          subtitleBubble.classList.remove("visible", "hiding");
          subtitleText.innerHTML = "";
          wordSpans = [];
        }, 250);
      }

      async function startListening() {
        console.log("[VoiceWindow] startListening() called");

        window.voiceApi.send("restart-stt");

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });

          audioContext = new AudioContext({ sampleRate: 48000 });
          const source = audioContext.createMediaStreamSource(mediaStream);

          try {
            await audioContext.audioWorklet.addModule(
              "workers/audio.processor.js",
            );
            workletNode = new AudioWorkletNode(
              audioContext,
              "audio-capture-processor",
            );
            workletNode.port.onmessage = (event) => {
              if (!isListening) return;
              if (event.data.type === "audio") {
                const downsampled = downsample(
                  event.data.buffer,
                  audioContext.sampleRate,
                  16000,
                );
                const int16Data = float32ToInt16(downsampled);
                window.voiceApi.send("audio-data", int16Data.buffer);
              }
            };
            source.connect(workletNode);
          } catch (e) {
            scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            scriptProcessor.onaudioprocess = (e) => {
              if (!isListening) return;
              const inputData = e.inputBuffer.getChannelData(0);
              const downsampled = downsample(
                inputData,
                audioContext.sampleRate,
                16000,
              );
              const int16Data = float32ToInt16(downsampled);
              window.voiceApi.send("audio-data", int16Data.buffer);
            };
            source.connect(scriptProcessor);
            scriptProcessor.connect(audioContext.destination);
          }

          isListening = true;
          setState(
            currentVoiceResults.length > 0
              ? VoiceState.AWAITING_SELECTION
              : VoiceState.LISTENING,
          );
          screenCaptured = false;
          window.voiceApi.send("capture-screen");
        } catch (err) {
          console.error("[VoiceWindow] Mic error:", err);
          setStatusLabel("Mic Error", "error");
          try {
            window.voiceApi.send("close-voice-window");
          } catch (e) {}
        }
      }

      function stopListening() {
        isListening = false;
        if (workletNode) {
          try {
            workletNode.disconnect();
          } catch (e) {}
          workletNode = null;
        }
        if (scriptProcessor) {
          try {
            scriptProcessor.disconnect();
            scriptProcessor.onaudioprocess = null;
          } catch (e) {}
          scriptProcessor = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
        if (audioContext && audioContext.state !== "closed") {
          audioContext.close();
          audioContext = null;
        }
        if (
          currentState === VoiceState.LISTENING ||
          currentState === VoiceState.AWAITING_SELECTION
        ) {
          setState(VoiceState.PROCESSING);
        }
      }

      let shouldListenAgain = false;

      window.voiceApi.receive("continue-listening", () => {
        console.log("[VoiceWindow] continue-listening received");
        if (canAutoListen()) {
          shouldListenAgain = true;
          consecutiveListenCount++;
          console.log(
            `[VoiceWindow] shouldListenAgain=true, awaitingAudio=${awaitingAudio}, isSpeaking=${isSpeaking}`,
          );

          if (!isSpeaking && !currentAudio && !awaitingAudio) {
            console.log(
              "[VoiceWindow] Not speaking/awaiting - starting listening immediately",
            );
            shouldListenAgain = false;

            playAudioCue(AudioCue.LISTENING);
            setState(VoiceState.LISTENING);
            startListening();
          }
        } else {
          console.log("[VoiceWindow] Max listens reached");
          shouldListenAgain = false;
        }
      });

      function playAudioResponse(audioDataUrl, responseText) {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        if (karaokeInterval) {
          clearInterval(karaokeInterval);
          karaokeInterval = null;
        }

        currentAudio = new Audio(audioDataUrl);
        isSpeaking = true;
        setState(VoiceState.SPEAKING);

        currentAudio.onloadedmetadata = () => {
          startKaraoke(responseText, currentAudio.duration * 1000);
        };

        currentAudio.onended = () => {
          isSpeaking = false;
          currentAudio = null;

          if (currentVoiceResults && currentVoiceResults.length > 0) {
            setState(VoiceState.SHOWING_RESULTS);

            setTimeout(() => {
              if (currentVoiceResults.length > 0) {
                startListening();
              } else {
                setState(VoiceState.IDLE);
              }
            }, 300);
          } else if (shouldListenAgain) {
            console.log("[VoiceWindow] Audio ended, shouldListenAgain=true");
            shouldListenAgain = false;

            playAudioCue(AudioCue.LISTENING);
            setState(VoiceState.LISTENING);
            startListening();
          } else {
            setState(VoiceState.IDLE);
            // Only auto-close if no UI is being displayed
            if (
              !hasActiveUI &&
              (!currentVoiceResults || currentVoiceResults.length === 0)
            ) {
              triggerClose();
            }
          }
        };

        currentAudio.onerror = () => {
          isSpeaking = false;
          currentAudio = null;

          if (karaokeInterval) {
            clearInterval(karaokeInterval);
            karaokeInterval = null;
          }
          hideSubtitles();
          if (shouldListenAgain) {
            shouldListenAgain = false;
            playAudioCue(AudioCue.LISTENING);
            setState(VoiceState.LISTENING);
            startListening();
          } else {
            setState(VoiceState.IDLE);
          }
        };

        currentAudio.play().catch((err) => {
          console.error("[VoiceWindow] Playback failed:", err);
          isSpeaking = false;
          currentAudio = null;

          if (karaokeInterval) {
            clearInterval(karaokeInterval);
            karaokeInterval = null;
          }
          hideSubtitles();
          if (shouldListenAgain) {
            shouldListenAgain = false;
            playAudioCue(AudioCue.LISTENING);
            setState(VoiceState.LISTENING);
            startListening();
          }
        });
      }

      window.voiceApi.receive("screen-captured", (imageData) => {
        screenCaptured = true;
        capturedImage = imageData;
      });

      window.voiceApi.receive("screen-used", () => {
        showScreenBadge();
      });

      window.voiceApi.receive("stt-partial-result", (text) => {
        if (text) partialEl.textContent = text;
      });

      window.voiceApi.receive("stt-result", (text) => {
        partialEl.textContent = "";

        if (
          currentState === VoiceState.AWAITING_SELECTION &&
          currentVoiceResults.length > 0
        ) {
          stopListening();

          setState(VoiceState.PROCESSING);

          const resultsContext = currentVoiceResults.map((item, index) => ({
            index: index + 1,
            name: item.data.name || item.data,
            type: item.type,
            path:
              typeof item.data === "string" ? item.data : item.data.path || "",
          }));

          window.voiceApi.send("voice-query", {
            query: text,
            image: capturedImage,
            previousResults: resultsContext,
          });

          hideVoiceResults();
          return;
        }

        stopListening();
        setState(VoiceState.PROCESSING);

        hideVoiceResults();

        originalQuery = text;
        window.voiceApi.send("voice-query", {
          query: text,
          image: capturedImage,
        });
      });

      window.voiceApi.receive("ai-status", (stage) => {
        switch (stage) {
          case "thinking":
            blobEl.className = "ai processing";
            setStatusLabel("Thinking…", "thinking");
            break;
          case "working":
            blobEl.className = "ai processing";
            setStatusLabel("Working on it…", "thinking");
            break;
          case "speaking":
            setStatusLabel("", "");
            break;
          case "idle":
            blobEl.className = "ai";
            setStatusLabel("", "");
            break;
        }
      });

      window.voiceApi.receive("ai-error", (data) => {
        const isQuota = data && data.type === "quota";
        const msg = isQuota ? "Quota exceeded" : "Unable to get response";
        setStatusLabel("Mic Error", "error");

        // Auto-close after 3 s
        setTimeout(() => {
          if (currentState === VoiceState.ERROR) triggerClose();
        }, 3000);
      });

      window.voiceApi.receive("voice-response", (data) => {
        if (data.text) {
          words = data.text.split(" ").filter((w) => w.trim());
          awaitingAudio = true;
          if (data.audio) {
            awaitingAudio = false;
            playAudioResponse(data.audio, data.text);
          }
        }
      });

      window.voiceApi.receive("voice-audio-ready", (audioDataUrl) => {
        awaitingAudio = false;
        if (audioDataUrl && words.length > 0) {
          playAudioResponse(audioDataUrl, words.join(" "));
        } else if (shouldListenAgain) {
          console.log(
            "[VoiceWindow] No audio but shouldListenAgain=true - starting listening",
          );
          shouldListenAgain = false;
          playAudioCue(AudioCue.ACTIVATION);
          setState(VoiceState.LISTENING);
          startListening();
        } else {
          // Close immediately with closing sound
          if (!hasActiveUI && currentVoiceResults.length === 0) {
            triggerClose();
          } else {
            setState(VoiceState.IDLE);
          }
        }
      });

      window.voiceApi.receive("voice-search-results", (results) => {
        try {
          const data =
            typeof results === "string" ? JSON.parse(results) : results;

          if (data.results && Array.isArray(data.results)) {
            currentVoiceResults = data.results.map((item) => ({
              type: item.type,
              data: item.data !== undefined ? item.data : item,
            }));
            voiceResultsListEl.innerHTML = "";

            data.results.forEach((item, i) => {
              let iconSvg =
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';
              let iconClass = "";
              if (item.type === "app") {
                iconSvg =
                  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>';
                iconClass = "app-icon";
              } else if (item.type === "folder") {
                iconSvg =
                  '<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
                iconClass = "folder-icon";
              } else if (item.type === "file") {
                iconSvg =
                  '<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>';
              }

              const el = document.createElement("div");
              el.className = "result-item";
              el.style.animationDelay = `${i * 30}ms`;
              el.innerHTML = `
              <div class="result-icon ${iconClass}">${iconSvg}</div>
              <div class="result-content">
                <div class="result-name">${safeStr(item.name)}</div>
                <div class="result-type" style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px;">${safeStr(item.type)}</div>
              </div>            `;
              // For voice selection we normally just wait for speech, but we can allow click too
              el.addEventListener("click", () => {
                window.voiceApi.send("voice-query", {
                  query: String(i + 1),
                  image: capturedImage,
                  previousResults: currentVoiceResults.map((r, idx) => ({
                    index: idx + 1,
                    name: r.data.name || r.data,
                    type: r.type,
                    path:
                      typeof r.data === "string" ? r.data : r.data.path || "",
                  })),
                });
                hideVoiceResults();
              });

              voiceResultsListEl.appendChild(el);
            });

            if (currentVoiceResults.length > 0) {
              voiceResultsEl.classList.add("visible");
              setState(VoiceState.SHOWING_RESULTS);
            }
          } else {
            displayVoiceResults(data);
          }
        } catch (e) {
          console.error("[VoiceWindow] Failed to parse search results:", e);
        }
      });

      // Safely stringify any value — properly HTML escaped
      function safeStr(v) {
        if (v === null || v === undefined) return "N/A";
        if (typeof v !== "object") {
          const s = String(v);
          return s.replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }
        if (Array.isArray(v)) return v.map(safeStr).join(", ");
        const parts = Object.entries(v)
          .slice(0, 3)
          .map(([k, vv]) => `${safeStr(k)}: ${safeStr(vv)}`);
        return parts.join(" · ");
      }

      function renderDynamicUI(component, rawData) {
        const data =
          typeof rawData === "string"
            ? (() => {
                try {
                  return JSON.parse(rawData);
                } catch {
                  return rawData;
                }
              })()
            : rawData;

        // Normalize component names (skill uses hyphen, LLM may use camelCase)
        const normalized = (component || "").replace(/-([a-z])/g, (_, c) =>
          c.toUpperCase(),
        );

        switch (normalized) {
          case "commandList":
            renderCommandList(data);
            break;
          case "keyValue":
            renderKeyValue(data);
            break;
          case "cardList":
            renderCardList(data);
            break;
          case "table":
            renderTable(data);
            break;
          default:
            if (typeof rawData === "string") {
              showAIResponse(rawData);
            }
            break;
        }
      }

      function showAIResponse(rawData, skipClear = false) {
        if (!skipClear) clearForUI();
        const container = document.createElement("div");
        container.className = "dui-container";
        container.style.padding = "10px";
        container.style.fontSize = "14px";
        container.style.lineHeight = "1.4";
        container.textContent = rawData;
        voiceResultsListEl.appendChild(container);
      }

      function clearForUI() {
        voiceResultsListEl.innerHTML = "";

        currentVoiceResults = [];
      }

      function renderKeyValue(data) {
        clearForUI();
        const container = document.createElement("div");
        container.className = "dui-container";

        // Parse data — could be JSON string or object
        let kvPairs = {};
        if (typeof data === "string") {
          try {
            kvPairs = JSON.parse(data);
          } catch {
            kvPairs = { result: data };
          }
        } else if (typeof data === "object" && data !== null) {
          kvPairs = data;
        }

        // Flatten nested objects one level
        const flat = {};
        for (const [k, v] of Object.entries(kvPairs)) {
          if (typeof v === "object" && v !== null && !Array.isArray(v)) {
            for (const [nk, nv] of Object.entries(v)) {
              flat[nk] = nv;
            }
          } else {
            flat[k] = v;
          }
        }

        const grid = document.createElement("div");
        grid.className = "dui-kv-grid";

        for (const [key, value] of Object.entries(flat)) {
          const item = document.createElement("div");
          item.className = "dui-kv-item";
          const label = key
            .replace(/([A-Z])/g, " $1")
            .replace(/[_-]/g, " ")
            .trim();

          const keySpan = document.createElement("span");
          keySpan.className = "dui-kv-key";
          keySpan.textContent = label;

          const valSpan = document.createElement("span");
          valSpan.className = "dui-kv-value";
          valSpan.title = String(value);
          valSpan.textContent = String(value ?? "N/A");

          item.appendChild(keySpan);
          item.appendChild(valSpan);
          grid.appendChild(item);
        }

        container.appendChild(grid);
        voiceResultsListEl.appendChild(container);
      }

      function renderCardList(data) {
        clearForUI();
        const container = document.createElement("div");
        container.className = "dui-container";

        let items = [];
        if (typeof data === "string") {
          try {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed)) items = parsed;
            else if (parsed.apps)
              items = parsed.apps.map((a) =>
                typeof a === "string"
                  ? { name: a, type: "app" }
                  : { name: a.name || a, type: "app", ...a },
              );
            else if (parsed.processes) items = parsed.processes;
            else
              items = Object.entries(parsed).map(([k, v]) => ({
                name: k,
                value: v,
              }));
          } catch {
            items = [{ name: data }];
          }
        } else if (Array.isArray(data)) {
          items = data;
        } else if (data && typeof data === "object") {
          if (data.apps)
            items = data.apps.map((a) =>
              typeof a === "string"
                ? { name: a, type: "app" }
                : { name: a.name || a, type: "app", ...a },
            );
          else
            items = Object.entries(data).map(([k, v]) => ({
              name: k,
              value: typeof v === "object" ? JSON.stringify(v) : v,
            }));
        }

        const list = document.createElement("div");
        list.className = "dui-card-list";

        items.forEach((item, i) => {
          const card = document.createElement("div");
          card.className = "dui-card";
          card.style.animationDelay = i * 30 + "ms";

          const name =
            typeof item === "string"
              ? item
              : item.name || item.ProcessName || item.Name || "Unknown";
          const sub = item.path || item.type || item.status || "";
          const badge = item.type || "";

          card.innerHTML = `
                    <div class="dui-card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></div>
                    <div class="dui-card-body">
                        <div class="dui-card-title">${escapeHtml(String(name))}</div>
                        ${sub ? '<div class="dui-card-sub">' + escapeHtml(String(sub)) + "</div>" : ""}
                    </div>
                    ${badge ? '<span class="dui-card-badge">' + escapeHtml(String(badge)) + "</span>" : ""}
                `;
          list.appendChild(card);
        });

        container.appendChild(list);
        voiceResultsListEl.appendChild(container);
      }

      function renderTable(data, skipClear = false) {
        if (!skipClear) clearForUI();
        const container = document.createElement("div");
        container.className = "dui-container";

        let rows = [];
        if (typeof data === "string") {
          try {
            rows = JSON.parse(data);
          } catch {
            rows = [];
          }
        } else if (Array.isArray(data)) {
          rows = data;
        }

        if (!Array.isArray(rows)) rows = [rows];

        if (rows.length > 0) {
          const table = document.createElement("table");
          table.className = "dui-table";

          const cols = Object.keys(rows[0]).filter(
            (c) =>
              c !== "CimClass" &&
              c !== "CimInstanceProperties" &&
              c !== "CimSystemProperties",
          );
          const colLabels = {
            Id: "PID",
            ProcessName: "Name",
            CPU: "CPU (s)",
            WorkingSet: "Memory",
          };

          const thead = document.createElement("thead");
          const headerRow = document.createElement("tr");
          cols.forEach((col) => {
            const th = document.createElement("th");
            th.textContent = colLabels[col] || col;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          rows.forEach((row) => {
            const tr = document.createElement("tr");
            cols.forEach((col) => {
              const td = document.createElement("td");
              let val = row[col];
              if (col === "WorkingSet" && typeof val === "number") {
                val = (val / 1024 / 1024).toFixed(1) + " MB";
              } else if (col === "CPU" && typeof val === "number") {
                val = val.toFixed(1);
              }
              td.textContent = val ?? "N/A";
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          container.appendChild(table);
        } else {
          const empty = document.createElement("div");
          empty.className = "dui-empty";
          empty.textContent = "No data available.";
          container.appendChild(empty);
        }

        voiceResultsListEl.appendChild(container);
      }

      function renderCommandList(data) {
        voiceResultsListEl.innerHTML = "";

        const container = document.createElement("div");
        container.className = "custom-commands-container";

        const cmds = data.customCommands || data.commands || [];

        if (cmds.length === 0) {
          const empty = document.createElement("div");
          empty.className = "commands-empty";
          empty.textContent = "No custom commands saved yet.";
          container.appendChild(empty);
        } else {
          cmds.forEach((cmd, i) => {
            const card = document.createElement("div");
            card.className = "command-card";
            card.style.animationDelay = i * 60 + "ms";

            const trigger = document.createElement("div");
            trigger.className = "command-trigger";
            trigger.innerHTML = `
                        <span class="trigger-label">"${escapeHtml(cmd.trigger)}"</span>
                        <span class="trigger-badge">${cmd.actionCount || cmd.actions?.length || 0} action${(cmd.actionCount || cmd.actions?.length || 0) !== 1 ? "s" : ""}</span>
                    `;
            card.appendChild(trigger);

            if (cmd.actions && cmd.actions.length > 0) {
              const actionsList = document.createElement("div");
              actionsList.className = "command-actions-list";
              cmd.actions.forEach((a) => {
                const pill = document.createElement("span");
                pill.className = "command-action-pill";

                let label = "";
                const actionText = a.action || a.actionName;
                if (actionText) {
                  label =
                    actionText +
                    (a.appName
                      ? `: ${a.appName}`
                      : a.command
                        ? `: ${a.command}`
                        : a.query
                          ? `: ${a.query}`
                          : "");
                } else {
                  label = "Unknown action";
                }

                pill.textContent = label;
                actionsList.appendChild(pill);
              });
              card.appendChild(actionsList);
            }

            container.appendChild(card);
          });
        }

        voiceResultsListEl.appendChild(container);

        currentVoiceResults = [];
      }

      window.voiceApi.receive("dynamic-ui", (payload) => {
        try {
          const { component, data } = payload;

          // Adjust clear logic for voice
          voiceResultsListEl.innerHTML = "";
          document.getElementById("voice-results-header").textContent =
            "Here is what I found:";
          currentVoiceResults = [];

          renderDynamicUI(component, data);

          // Show the container
          voiceResultsEl.classList.add("visible");
          // Data display — stay idle, do NOT auto-listen and do NOT auto-close
          hasActiveUI = true;
          shouldListenAgain = false;
          setState(VoiceState.IDLE);
        } catch (e) {
          console.error("[VoiceWindow] Dynamic UI render err:", e);
        }
      });

      function parseMarkdownTable(text) {
        const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.includes('|'));
        if (lines.length < 2) return null;
        function parseCells(line) {
          const cells = line.split('|').map(c => c.trim());
          if (cells.length > 0 && cells[0] === '') cells.shift();
          if (cells.length > 0 && cells[cells.length - 1] === '') cells.pop();
          return cells;
        }
        const headers = parseCells(lines[0]).filter(Boolean);
        if (headers.length === 0) return null;
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          if (/^[\s|:=-]+$/.test(lines[i])) continue;
          const cols = parseCells(lines[i]);
          if (cols.length === 0) continue;
          const row = {};
          headers.forEach((h, idx) => { row[h] = cols[idx] ?? ''; });
          rows.push(row);
        }
        return rows.length > 0 ? rows : null;
      }

      window.voiceApi.receive('ui-blocks', (blocks) => {
        try {
          if (!blocks || blocks.length === 0) return;
          voiceResultsListEl.innerHTML = '';
          document.getElementById('voice-results-header').textContent = 'Here is what I found:';
          currentVoiceResults = [];
          for (const block of blocks) {
            const rows = parseMarkdownTable(block);
            if (rows) {
              renderTable(rows, true);
            } else {
              showAIResponse(block, true);
            }
          }
          voiceResultsEl.classList.add('visible');
          hasActiveUI = true;
          shouldListenAgain = false;
          setState(VoiceState.IDLE);
        } catch (e) {
          console.error('[VoiceWindow] ui-blocks render err:', e);
        }
      });

      window.voiceApi.receive("start-listening", async () => {
        resetListenCounter();
        // Activation sound played by background window already
        startListening();
      });

      window.voiceApi.receive("stop-listening", () => stopListening());

      // When an action is executed (file opened etc), don't listen again
      window.voiceApi.receive("action-complete", () => {
        console.log("[VoiceWindow] Action complete - closing after audio");
        shouldListenAgain = false;
      });

      window.voiceApi.receive("auto-close-voice", () => {
        console.log("[VoiceWindow] Received auto-close-voice from main");
        isClosing = false; // Reset for next session
        // fullReset is handled by visibilitychange (on hide) so we don't
        // reset here — avoids flickering old content when window reopens
      });

      // Reset state when window is hidden so it's clean on next open
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          fullReset();
        }
      });

      // Centralized close function - prevents double sounds
      function triggerClose() {
        if (isClosing) return;
        isClosing = true;
        playAudioCue(AudioCue.CLOSING);
        fullReset();
        window.voiceApi.send("close-voice-window");
      }

      document
        .getElementById("voice-results")
        .addEventListener("click", (e) => e.stopPropagation());

      document.body.addEventListener("click", (e) => {
        if (e.target.closest("#voice-results")) return;
        triggerClose();
      });

      window.addEventListener("blur", () => {
        triggerClose();
      });

      window.addEventListener("load", () => {
        preloadActivationSound();
        setStatusLabel("Initializing\u2026", "thinking");
        window.voiceApi.send("voice-window-ready");
      });
      window.addEventListener("beforeunload", () => {
        stopListening();
        hideVoiceResults();
        window.voiceApi.send("voice-window-closed");
      });
    </script>
  </body>
</html>
